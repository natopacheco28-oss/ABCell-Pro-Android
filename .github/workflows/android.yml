name: Compilar ABCell Móvil APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Verificar y compilar APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Instalar SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Verificar origen y esquema
        run: python3 -m unittest discover -s tools -p 'test_*.py' -v
      - name: Pruebas, lint y APK instalable de prueba
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug
      - name: Preparar APK
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk artifacts/ABCell-Movil.apk
          cd artifacts
          sha256sum ABCell-Movil.apk > SHA256SUMS.txt
      - name: Publicar APK de prueba
        uses: actions/upload-artifact@v4
        with:
          name: ABCell-Movil-APK
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
      - name: Compilar versión firmada (si se configuraron los cuatro secretos)
        if: github.event_name != 'pull_request'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$ANDROID_KEYSTORE_BASE64$ANDROID_KEYSTORE_PASSWORD$ANDROID_KEY_ALIAS$ANDROID_KEY_PASSWORD" ]; then
            echo 'Sin secretos de firma: se conserva únicamente la APK de prueba.'
            exit 0
          fi
          : "${ANDROID_KEYSTORE_BASE64:?Falta ANDROID_KEYSTORE_BASE64}"
          : "${ANDROID_KEYSTORE_PASSWORD:?Falta ANDROID_KEYSTORE_PASSWORD}"
          : "${ANDROID_KEY_ALIAS:?Falta ANDROID_KEY_ALIAS}"
          : "${ANDROID_KEY_PASSWORD:?Falta ANDROID_KEY_PASSWORD}"
          export SIGNING_STORE_FILE="$RUNNER_TEMP/abcell-release.jks"
          trap 'rm -f "$SIGNING_STORE_FILE"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$SIGNING_STORE_FILE"
          ./gradlew --no-daemon assembleRelease
          mkdir -p release-artifacts
          cp app/build/outputs/apk/release/app-release.apk release-artifacts/ABCell-Movil-release.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose release-artifacts/ABCell-Movil-release.apk
          cd release-artifacts
          sha256sum ABCell-Movil-release.apk > SHA256SUMS.txt
      - name: Publicar APK firmada
        if: github.event_name != 'pull_request' && hashFiles('release-artifacts/*.apk') != ''
        uses: actions/upload-artifact@v4
        with:
          name: ABCell-Movil-Release
          path: release-artifacts/
          if-no-files-found: error
          retention-days: 30
      - name: Publicar resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pruebas-y-lint
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore

  device-tests:
    name: Pruebas Android API ${{ matrix.api }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        api: [29, 35]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Activar aceleración del emulador
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: ./gradlew --no-daemon connectedDebugAndroidTest
      - name: Publicar pruebas en dispositivo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pruebas-android-${{ matrix.api }}
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: ignore
